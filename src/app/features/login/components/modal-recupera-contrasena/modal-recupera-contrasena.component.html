<p-dialog
  header="Recupera contraseña 🔐."
  [(visible)]="esVisibleRecuperaContrasenaDialog"
  [modal]="true"
  [breakpoints]="{ '1199px': '50vw', '960px': '60vw', '768px': '80vw', '575px': '95vw' }"
  [style]="{ width: '30vw', maxWidth: '100%' }"
  [draggable]="true"
  [resizable]="true"
  (closable)="true"
  (visibleChange)="onHide()">
  <div class="flex flex-col items-center justify-center w-full">
  <form [formGroup]="formulario" (ngSubmit)="enviar()" autocomplete="off" class="w-full max-w-sm">
    <p-card class="shadow-1 w-full">
      <ng-template pTemplate="content">
        <div class="w-full">
          <p-floatlabel variant="on" class="w-full">
            <input
              pInputText
              id="on_label_correo"
              type="email"
              [ngClass]="{ 'ng-invalid ng-dirty': esValido('correo'), 'ng-valid': !esValido('correo') }"
              formControlName="correo"
              autocomplete="off"
              class="w-full"
            />
            <label for="on_label_correo">Correo</label>
          </p-floatlabel>
          @if (esValido('correo')) {
            <small class="campoErrorTexto" [innerHTML]="getErrores('correo', 'Correo')"></small>
          }
        </div>
      </ng-template>
      <ng-template pTemplate="footer">
        <div class="flex mt-1">
          <p-button label="Recuperar" class="w-full" styleClass="w-full" type="submit" [disabled]="formulario.invalid" />
        </div>
      </ng-template>
    </p-card>
  </form>
</div>
</p-dialog>
